<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Franken</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/franken-ui@1.1.0/dist/css/core.min.css"
    />
    <script
      src="https://unpkg.com/franken-ui@1.1.0/dist/js/core.iife.js"
      type="module"
    ></script>
    <script
      src="https://unpkg.com/franken-ui@1.1.0/dist/js/icon.iife.js"
      type="module"
    ></script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/franken-wc@0.0.2/dist/css/slate.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/franken-wc@0.0.2/dist/css/stone.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/franken-wc@0.0.2/dist/css/gray.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/franken-wc@0.0.2/dist/css/neutral.min.css"
    />
  </head>
  <body>
    <nav class="uk-navbar-container">
      <div class="uk-container">
        <div uk-navbar>
          <div class="uk-navbar-left">
            <ul class="uk-navbar-nav">
              <a
                class="uk-navbar-item uk-logo"
                href="#"
                aria-label="Back to Home"
                >Foodie Hub</a
              >

              <li><a href="index.html">Inspiration</a></li>
              <li class="uk-active">
                <a href="./favorites.html">Favorites</a>
              </li>
            </ul>
          </div>
          <div class="uk-navbar-right">
            <div class="uk-navbar-item">
              <form class="uk-search uk-search-navbar">
                <span uk-search-icon></span>
                <input
                  class="uk-search-input"
                  type="search"
                  placeholder="Search"
                  aria-label="Search"
                />
              </form>
            </div>
          </div>

        </div>
      </div>
    </nav>

    <div id="content" class="uk-width-2-3@s uk-margin-auto@m uk-margin">

      <div class="uk-width-1-1@m uk-card uk-card-body uk-card-default">

        <div class="uk-margin-medium-left">
          <label class="uk-heading-small" for="title" id="mealTitle"></label>
        </div>

        <div class="uk-section uk-section-default" style="padding-top: 2rem; padding-bottom: 2rem;">
          <div class="uk-container">
            <div uk-grid>
              <div class="uk-width-2-5@m" id="mealImg"></div>
              <div id="ingredientList" class="uk-width-3-5@m">
              </div>
            </div>
          </div>
        </div>

        <div class="uk-section uk-section-muted uk-inline">
          <div class="uk-container meal-instruction-wrapper">
            <h3 class="uk-card-title">Instructions:</h3>
            <ul class="uk-list uk-margin-top" id="mealInstruction"></ul>
          </div>
          <div class="toolbar-wrapper"></div>
        </div>

      </div>
    </div>

    <div id="emptyListContainer" class="uk-container uk-margin-auto@m" style="display: none">
      <div class="uk-child-width-expand@s uk-text-center" uk-grid>
        <div class="uk-padding uk-background-muted uk-panel text-muted-foreground uk-card uk-card-body uk-card-secondary">
          <p class="uk-h4">
            Favorite meals list is empty. Find some inspiration
            <a href="index.html">✨<u style="color: black">here</u>✨</a>
          </p>
        </div>
      </div>
    </div>

    <nav aria-label="Pagination">
      <ul class="uk-pagination uk-flex-center" uk-margin>
        <li>
          <a href="#"><span uk-pagination-previous></span></a>
        </li>
        <li class="uk-active"><span aria-current="page">1</span></li>
        <li class="uk-disabled"><span>…</span></li>
        <li><a href="#">5</a></li>
        <li>
          <a href="#"><span uk-pagination-next></span></a>
        </li>
      </ul>
    </nav>


  <div id="confirmModal" uk-modal>
    <div class="uk-modal-body uk-modal-dialog uk-text-center">
      <h2 class="uk-modal-title">Remove meal from favorites?</h2>
      <p class="modal-content uk-margin-small-top"></p>
      <p class="uk-text-center uk-margin-medium-top">
        <button class="uk-modal-close uk-button uk-button-default" type="button">
          No
        </button>
        <button id="confirmBtn" class="uk-button uk-button-primary" type="button">Yes</button>
      </p>
    </div>
  </div>

  </body>

  <script
    src="https://code.jquery.com/jquery-2.2.4.min.js"
    integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44="
    crossorigin="anonymous"
  ></script>
  <script src="./favorites.js"></script>
</html>

<style>
  *[id^='ingredient_'] {
    overflow-y: scroll;
    max-height: 90%;
    margin-top: 1rem;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  *[id^='card_'] {
    min-height: 250px;
    max-height: 300px;
  }

  *[id^='meal_'] {
    max-height: inherit;
  }

  .image-wrapper {
    margin-top: 1rem;
    margin-bottom: 1rem;
  }

  .image-wrapper > img {
    border-radius: .25rem;
  }

  #ingredientList div.uk-grid:not(:first-child)  {
    margin-top: .5rem;
  }

  .action-toolbar{
    padding: .75rem;
  }

  .hearted svg {
    fill : #c90000
  }

  #ingredientList {
    height: 275px;
    scrollbar-width: thin;
    overflow-y: auto;
  }

</style>
